# Nightly Iceberg maintenance for the lake tables.
# Catalog and warehouse live in the Polaris-backed bucket polaris-corvus (config comment only).
catalog: corvus
snapshot_max_age_days: 7
spark:
  spark_version: "4.1.4"
  image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
  iceberg_runtime: org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.12.0
  iceberg_aws_bundle: org.apache.iceberg:iceberg-aws-bundle:1.12.0
tables:
  # Raw packets are kept permanently (maintainer decision 2026-11-18, reviewed yearly); rows only
  # leave through GDPR erasure, which Corvus performs as Iceberg row deletes.
  - name: capture.raw
    retention_days: null
    day_column: date
  - name: capture.events
    retention_days: null
    day_column: date
  # Corvus session metadata: kept as long as the raw capture; erasure is an Iceberg row delete by Corvus.
  - name: capture.sessions
    retention_days: null
    day_column: date
  - name: capture.segments
    retention_days: null
    day_column: date
  - name: capture.session_ends
    retention_days: null
    day_column: date
  # Layer tables (add-lake-layers, design decision 15). Rebuilt from capture.raw, so 365 days; the
  # quarantine table holds session ids and player keys, so 30 days. Created by the layers DAGs.
  - name: refined.packets
    retention_days: 365
    day_column: date
  - name: refined.client_info
    retention_days: 365
    day_column: date
  - name: refined.plugin_messages
    retention_days: 365
    day_column: date
  - name: refined.sessions
    retention_days: 365
    day_column: date
  - name: features.session_stats
    retention_days: 365
    day_column: date
  - name: features.windows
    retention_days: 365
    day_column: date
  - name: quality.check_results
    retention_days: 400
    day_column: date
  - name: quality.quarantine_sessions
    retention_days: 30
    day_column: date
